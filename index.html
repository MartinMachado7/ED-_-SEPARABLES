<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizador de ED Separables</title>
  
  <link rel="icon" type="image/svg+xml" href="./logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <span class="material-symbols-outlined logo-icon">auto_graph</span>
      <h1 id="app-title">Solucionador de ED Separables</h1>
    </header>

    <main class="content">
      <!-- Panel de Entrada unica -->
      <div class="controls-card">
        <h2>Entrada de Datos</h2>
        <p class="instruction">Ecuacion de la forma: <code>dy/dx = F(x, y)</code></p>
        
        <div class="form-group">
          <label for="fxy-input">Expresion F(x, y):</label>
          <input type="text" id="fxy-input" placeholder="Ej: x*y + x, (y/x), 2*x*y" value="x*y + x">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="x0-input">x0:</label>
            <input type="number" id="x0-input" placeholder="0" value="0" step="any">
          </div>
          <div class="form-group">
            <label for="y0-input">y0:</label>
            <input type="number" id="y0-input" placeholder="1" value="1" step="any">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="a-input">Intervalo [a]:</label>
            <input type="number" id="a-input" placeholder="-5" value="-5" step="any">
          </div>
          <div class="form-group">
            <label for="b-input">Intervalo [b]:</label>
            <input type="number" id="b-input" placeholder="5" value="5" step="any">
          </div>
        </div>

        <button id="solve-btn" class="btn-primary">Analizar y Resolver</button>
      </div>

      <!-- Resultados y Grafico -->
      <div class="results-column">
        <div class="steps-card">
          <h2>Informe de Resolucion</h2>
          <div id="steps-output"></div>
        </div>

        <div class="plot-card">
          <div id="plot"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="src/index.js"></script>
</body>
</html>
